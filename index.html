<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnkring Jong en Vrij - Ledenbeheer</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e74c3c;
            --light: #ecf0f1;
            --success: #2ecc71;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light);
            color: #333;
        }
        header {
            background-color: var(--primary);
            color: white;
            padding: 1rem;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background: #34495e;
        }
        nav button {
            background: none;
            border: none;
            color: white;
            padding: 1rem 2rem;
            cursor: pointer;
            font-size: 1rem;
        }
        nav button:hover, nav button.active {
            background-color: var(--accent);
        }
        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 1.5rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .section { display: none; }
        .section.active { display: block; }
        
        /* Formulier styling */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }
        .form-group { margin-bottom: 1rem; }
        .form-group.full-width { grid-column: span 2; }
        @media (max-width: 600px) { .form-group.full-width { grid-column: span 1; } }
        
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input, select { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="checkbox"] { width: auto; transform: scale(1.2); margin-right: 0.5rem; }
        
        button.btn { background-color: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button.btn:hover { opacity: 0.9; }

        /* Tabellen en Lijsten */
        .table-responsive { overflow-x: auto; margin-top: 1rem; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 0.9rem; }
        th { background-color: var(--primary); color: white; }
        .flex-row { display: flex; gap: 1rem; margin-bottom: 1rem; }
        .presence-row { display: flex; justify-content: space-between; padding: 0.6rem; border-bottom: 1px solid #eee; align-items: center; }
    </style>
</head>
<body>

    <header>
        <h1>Turnkring Jong en Vrij</h1>
        <p>Ledenbeheer & Aanwezigheden</p>
    </header>

    <nav>
        <button onclick="showSection('leden')" id="btn-leden" class="active">Ledenbeheer</button>
        <button onclick="showSection('aanwezigheid')" id="btn-aanwezigheid">Aanwezigheden</button>
    </nav>

    <div class="container">
        <!-- SECTIE 1: LEDENBEHEER -->
        <div id="section-leden" class="section active">
            <h2>Nieuw Lid Toevoegen</h2>
            <form id="lid-form" onsubmit="addLid(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Voornaam:</label>
                        <input type="text" id="lid-voornaam" required placeholder="Bijv. Sarah">
                    </div>
                    <div class="form-group">
                        <label>Naam:</label>
                        <input type="text" id="lid-naam" required placeholder="Bijv. Peeters">
                    </div>
                    <div class="form-group">
                        <label>Geboortedatum:</label>
                        <input type="date" id="lid-geboortedatum" required>
                    </div>
                    <div class="form-group">
                        <label>Geslacht:</label>
                        <select id="lid-geslacht" required>
                            <option value="V">Vrouw (V)</option>
                            <option value="M">Man (M)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Groep / Les:</label>
                        <select id="lid-groep" required>
                            <option value="Kleuters">Kleuters</option>
                            <option value="Meisjes 1">Meisjes 1</option>
                            <option value="Meisjes 2">Meisjes 2</option>
                            <option value="Jongens">Jongens</option>
                            <option value="Juffers 1">Juffers 1</option>
                            <option value="Juffers 2">Juffers 2</option>
                            <option value="Knapen">Knapen</option>
                            <option value="Turnsters en turners">Turnsters en turners</option>
                            <option value="Skippies">Skippies</option>
                            <option value="Jumpers">Jumpers</option>
                            <option value="Demo Team">Demo Team</option>
                            <option value="Dance Adults">Dance Adults</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Straat en huisnummer:</label>
                        <input type="text" id="lid-adres" placeholder="Dorpstraat 12">
                    </div>
                    <div class="form-group">
                        <label>Postcode en gemeente:</label>
                        <input type="text" id="lid-gemeente" placeholder="2000 Antwerpen">
                    </div>
                    <div class="form-group">
                        <label>Telefoon 1:</label>
                        <input type="tel" id="lid-tel1" placeholder="0470 00 00 00">
                    </div>
                    <div class="form-group">
                        <label>Telefoon 2:</label>
                        <input type="tel" id="lid-tel2" placeholder="Optioneel">
                    </div>
                    <div class="form-group">
                        <label>E-mail 1:</label>
                        <input type="email" id="lid-email1" placeholder="naam@email.com">
                    </div>
                    <div class="form-group">
                        <label>E-mail 2:</label>
                        <input type="email" id="lid-email2" placeholder="Optioneel">
                    </div>
                    <div class="form-group full-width" style="display: flex; align-items: center; margin-top: 1rem;">
                        <input type="checkbox" id="lid-marketing">
                        <label for="lid-marketing" style="margin: 0; cursor: pointer;">Wenst e-mails te ontvangen van Jong & Vrij i.v.m. activiteiten?</label>
                    </div>
                </div>
                <br>
                <button type="submit" class="btn">Lid Opslaan</button>
            </form>

            <h2>Geregistreerde Leden</h2>
            <div class="table-responsive">
                <table id="leden-tabel">
                    <thead>
                        <tr>
                            <th>Naam & Voornaam</th>
                            <th>Groep</th>
                            <th>Geboortedatum</th>
                            <th>Geslacht</th>
                            <th>Contact</th>
                            <th>Mails Info?</th>
                            <th>Actie</th>
                        </tr>
                    </thead>
                    <tbody id="leden-lijst-body"><!-- Dynamisch --></tbody>
                </table>
            </div>
        </div>

        <!-- SECTIE 2: AANWEZIGHEDEN -->
        <div id="section-aanwezigheid" class="section">
            <h2>Aanwezigheden Registreren</h2>
            <div class="flex-row">
                <div style="flex: 1;">
                    <label>Kies Groep:</label>
                    <select id="filter-groep" onchange="loadAanwezigheidsLijst()">
                        <option value="Kleuters">Kleuters</option>
                        <option value="Meisjes 1">Meisjes 1</option>
                        <option value="Meisjes 2">Meisjes 2</option>
                        <option value="Jongens">Jongens</option>
                        <option value="Juffers 1">Juffers 1</option>
                        <option value="Juffers 2">Juffers 2</option>
                        <option value="Knapen">Knapen</option>
                        <option value="Turnsters en turners">Turnsters en turners</option>
                        <option value="Skippies">Skippies</option>
                        <option value="Jumpers">Jumpers</option>
                        <option value="Demo Team">Demo Team</option>
                        <option value="Dance Adults">Dance Adults</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label>Datum Les:</label>
                    <input type="date" id="les-datum" onchange="loadAanwezigheidsLijst()" required>
                </div>
            </div>

            <div id="aanwezigheids-lijst">
                <!-- Hier komen de vinkjes -->
            </div>
            <br>
            <button class="btn" onclick="saveAanwezigheid()">Aanwezigheden Opslaan</button>
        </div>
    </div>

    <script>
        // Database in browsergeheugen
        let database = JSON.parse(localStorage.getItem('turnkring_db_v2')) || { leden: [], aanwezigheden: {} };

        function saveDB() {
            localStorage.setItem('turnkring_db_v2', JSON.stringify(database));
        }

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`section-${sectionId}`).classList.add('active');
            document.getElementById(`btn-${sectionId}`).classList.add('active');

            if(sectionId === 'aanwezigheid') {
                if(!document.getElementById('les-datum').value) {
                    document.getElementById('les-datum').value = new Date().toISOString().split('T')[0];
                }
                loadAanwezigheidsLijst();
            } else {
                renderLeden();
            }
        }

        // Lid Toevoegen
        function addLid(e) {
            e.preventDefault();
            
            const nieuwLid = {
                id: Date.now().toString(),
                voornaam: document.getElementById('lid-voornaam').value,
                naam: document.getElementById('lid-naam').value,
                geboortedatum: document.getElementById('lid-geboortedatum').value,
                geslacht: document.getElementById('lid-geslacht').value,
                groep: document.getElementById('lid-groep').value,
                adres: document.getElementById('lid-adres').value,
                gemeente: document.getElementById('lid-gemeente').value,
                tel1: document.getElementById('lid-tel1').value,
                tel2: document.getElementById('lid-tel2').value,
                email1: document.getElementById('lid-email1').value,
                email2: document.getElementById('lid-email2').value,
                marketing: document.getElementById('lid-marketing').checked
            };

            database.leden.push(nieuwLid);
            saveDB();
            renderLeden();
            document.getElementById('lid-form').reset();
            alert("Lid succesvol toegevoegd!");
        }

        // Lid Verwijderen
        function deleteLid(id) {
            if(confirm("Weet je zeker dat je dit lid wilt verwijderen?")) {
                database.leden = database.leden.filter(lid => lid.id !== id);
                saveDB();
                renderLeden();
            }
        }

        // Ledenlijst opbouwen
        function renderLeden() {
            const tbody = document.getElementById('leden-lijst-body');
            tbody.innerHTML = '';
            
            // Sorteer op naam
            const gesorteerdeLeden = [...database.leden].sort((a, b) => a.naam.localeCompare(b.naam));

            gesorteerdeLeden.forEach(lid => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${lid.naam}</strong> ${lid.voornaam}</td>
                        <td>${lid.groep}</td>
                        <td>${lid.geboortedatum.split('-').reverse().join('-')}</td>
                        <td>${lid.geslacht}</td>
                        <td>
                            ${lid.email1 ? '📧 ' + lid.email1 + '<br>' : ''}
                            ${lid.tel1 ? '📞 ' + lid.tel1 : ''}
                        </td>
                        <td>${lid.marketing ? '✅ Ja' : '❌ Nee'}</td>
                        <td>
                            <button onclick="deleteLid('${lid.id}')" style="background:#e74c3c; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Wis</button>
                        </td>
                    </tr>
                `;
            });
        }

        // Aanwezigheidslijst laden
        function loadAanwezigheidsLijst() {
            const groep = document.getElementById('filter-groep').value;
            const datum = document.getElementById('les-datum').value;
            const container = document.getElementById('aanwezigheids-lijst');
            container.innerHTML = '';

            // Filter leden van geselecteerde groep en sorteer op naam
            const gefilterdeLeden = database.leden
                .filter(lid => lid.groep === groep)
                .sort((a, b) => a.naam.localeCompare(b.naam));

            if(gefilterdeLeden.length === 0) {
                container.innerHTML = '<p style="color:#7f8c8d; font-style:italic;">Geen leden gevonden in deze groep. Voeg eerst leden toe via het Ledenbeheer tabblad.</p>';
                return;
            }

            const key = `${datum}_${groep}`;
            const bestaandeAanwezigheid = database.aanwezigheden[key] || [];

            gefilterdeLeden.forEach(lid => {
                const isAanwezig = bestaandeAanwezigheid.includes(lid.id);
                container.innerHTML += `
                    <div class="presence-row">
                        <span><strong>${lid.naam}</strong> ${lid.voornaam}</span>
                        <input type="checkbox" value="${lid.id}" ${isAanwezig ? 'checked' : ''}>
                    </div>
                `;
            });
        }

        // Opslaan van de vinkjes
        function saveAanwezigheid() {
            const groep = document.getElementById('filter-groep').value;
            const datum = document.getElementById('les-datum').value;
            
            if(!datum) {
                alert("Kies een geldige datum!");
                return;
            }

            const checkboxes = document.querySelectorAll('#aanwezigheids-lijst input[type="checkbox"]');
            const aanwezigeLidIds = [];

            checkboxes.forEach(cb => {
                if(cb.checked) {
                    aanwezigeLidIds.push(cb.value);
                }
            });

            const key = `${datum}_${groep}`;
            database.aanwezigheden[key] = aanwezigeLidIds;
            saveDB();
            alert(`Aanwezigheden voor ${groep} op ${datum.split('-').reverse().join('-')} zijn opgeslagen!`);
        }

        // Start applicatie
        renderLeden();
    </script>
</body>
</html>
